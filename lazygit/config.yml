git:
  # pagers:
  #   - externalDiffCommand: difft --color=always
  pagers:
    - pager: delta --dark --paging=never

keybinding:
  universal:
    nextPage: <c-d>
    prevPage: <c-u>
    gotoTop: g
    gotoBottom: G
  commits:
    viewResetOptions: x

gui:
  theme:
    # Background color for the currently selected hunk/range
    selectedRangeBgColor:
      - blue
    # Background color for the currently selected single line
    selectedLineBgColor:
      - "#36283b"
